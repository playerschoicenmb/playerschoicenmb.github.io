<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="icon" href="images/logo.png">
<link rel="stylesheet" href="style.css">
<title>Gallery | Player's Choice Myrtle Beach</title>
<meta name="description" content="Videos and photos from inside Player's Choice in the Myrtle Beach Mall. Follow us on Instagram @playerschoicemb.">
</head>
<body data-page="gallery">
<main>
  <section class="hero">
    <h1>GALLERY</h1>
    <p class="sub">Follow us on Instagram! <a style="color:var(--red)" href="https://www.instagram.com/playerschoicemb/?hl=en" target="_blank" rel="noopener">@playerschoicemb</a></p>
    <p class="sub" style="color:var(--cyan)">HOVER TO PLAY ▶</p>
  </section>

  <section class="gal reveal" id="gal"></section>

  <section class="panel pink reveal" style="text-align:center">
    <h2>WANT MORE? CONTINUE?</h2>
    <p>New videos drop all the time. Follow along on every platform.</p>
    <a class="btn pink" href="https://www.instagram.com/playerschoicemb/?hl=en" target="_blank" rel="noopener">Instagram</a>
    <a class="btn" href="https://www.tiktok.com/@playerschoicemb" target="_blank" rel="noopener">TikTok</a>
    <a class="btn red" href="https://www.youtube.com/@PlayersChoiceMB" target="_blank" rel="noopener">YouTube</a>
    <a class="btn cyan" href="https://www.facebook.com/PlayersChoiceMB/" target="_blank" rel="noopener">Facebook</a>
  </section>
</main>
<script>
/* To add videos: drop MP4 files in /videos named clip1.mp4, clip2.mp4, ... (vertical 9:16 works best).
   Any missing file shows a retro caption card that links to Instagram instead. */
const IG = 'https://www.instagram.com/playerschoicemb/?hl=en';
const clips = [
  'Whatnot SUNDAY at 4pm EST!',
  'ROLAND: "Go attract new customers!"',
  'New inventory unboxing',
  'Trade night at the counter',
  'What you say to customers in the way',
  'Browsing the figure wall',
  'Digging through the comics',
  'Game case check',
  'Sorting the new arrivals',
  'Store walk-through',
  'Bin diving',
  "When you need your manager but they're having a worse day",
  'Store opens at 10am. That one customer at 9:59am',
  'She never gets what she wants 😭',
  'How the nicest people look before you talk to them',
  'pov: a customer is extremely confused'
];
const gal = document.getElementById('gal');
gal.innerHTML =
  `<a class="tile wide" href="index.html"><img src="images/storefront.jpg" alt="Player's Choice storefront"><span class="cap">THE STORE</span></a>
   <a class="tile wide" href="arcade.html"><img src="images/arcade-entrance.jpg" alt="Arcade entrance"><span class="cap">THE ARCADE · ALL GAMES 25¢</span></a>` +
  clips.map((c,i) => `<a class="tile" href="${IG}" target="_blank" rel="noopener">
    <video src="videos/clip${i+1}.mp4" muted loop playsinline preload="metadata"></video>
    <span class="play"></span><span class="cap">${c}</span></a>`).join('');
gal.querySelectorAll('.tile video').forEach(v => {
  const t = v.parentElement;
  v.addEventListener('error', () => { t.classList.add('empty'); v.remove(); }, {once:true});
  t.addEventListener('mouseenter', () => v.isConnected && v.play().catch(()=>{}));
  t.addEventListener('mouseleave', () => { if (v.isConnected) { v.pause(); v.currentTime = 0; } });
});
</script>
<script src="script.js"></script>
</body>
</html>
